name: Atelier Android APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Debug Expo Config
        run: npx expo config --json

      - name: 🏗️ Build Android APK locally on Runner
        run: eas build --platform android --profile preview --local --non-interactive

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atelier-Android-APK
          path: '*.apk'